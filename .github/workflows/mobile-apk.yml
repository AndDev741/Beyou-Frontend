name: Mobile APK

# Builds a signed release APK on every push to main and publishes it to a
# rolling GitHub Release ("mobile-latest") with a STABLE filename, so the
# download URL never changes:
#   https://github.com/AndDev741/Beyou-Frontend/releases/download/mobile-latest/beyou-latest.apk
#
# One-time setup (repo Settings → Secrets and variables → Actions):
#   EXPO_PUBLIC_API_URL = https://<your-public-backend>/api/v1  (must be HTTPS)
#     — may be a repo Variable or a Secret; the build reads either.
#   EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID = <web-oauth-client-id>.apps.googleusercontent.com
#     — the Web OAuth client id; without it signIn() returns a null idToken and
#       "Continue with Google" silently fails. Variable OR Secret; build reads either.
#   EXPO_PUBLIC_SENTRY_DSN = <DSN of the beyou-mobile GlitchTip project>
#     — optional. Omit it and the APK simply ships with error reporting off
#       (telemetry.ts no-ops without a DSN). Must point at a PUBLICLY reachable
#       collector: the app runs on real phones outside your network, so a
#       localhost or LAN address reports nowhere. Variable OR Secret.
#   Secrets:  ANDROID_KEYSTORE_BASE64   (base64 of a keystore you generate once)
#             ANDROID_KEYSTORE_PASSWORD
#             ANDROID_KEY_ALIAS
#             ANDROID_KEY_PASSWORD
# Generate the keystore + base64 (run locally, keep the .keystore file safe):
#   keytool -genkeypair -v -keystore beyou.keystore -alias beyou \
#     -keyalg RSA -keysize 2048 -validity 10000 \
#     -storepass <pw> -keypass <pw> -dname "CN=BeYou"
#   base64 -w0 beyou.keystore   # paste output into ANDROID_KEYSTORE_BASE64

on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "packages/**"
      - ".github/workflows/mobile-apk.yml"
  workflow_dispatch:

concurrency:
  group: mobile-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # publish the release
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Prebuild Android project
        working-directory: apps/mobile
        env:
          EXPO_NO_TELEMETRY: "1"
        run: npx expo prebuild --platform android --no-install

      - name: Decode release keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > apps/mobile/android/app/release.keystore

      - name: Build release APK
        working-directory: apps/mobile/android
        env:
          # EXPO_PUBLIC_* is inlined into the JS bundle at build time — this is
          # what points the installed app at your public backend. Accept it as a
          # repo Variable OR a Secret (falls back to the secret if the var is unset).
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL || secrets.EXPO_PUBLIC_API_URL }}
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ vars.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID || secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
          # Inlined into the bundle by Metro during this task, same as the two
          # above. Without it the APK ships with error reporting off.
          EXPO_PUBLIC_SENTRY_DSN: ${{ vars.EXPO_PUBLIC_SENTRY_DSN || secrets.EXPO_PUBLIC_SENTRY_DSN }}
          # Skips the source-map upload task that the @sentry/react-native/expo
          # config plugin adds to release builds (sentry.gradle.kts:50).
          #
          # It is not a workaround for a misconfiguration — the upload has
          # nowhere to go. sentry-cli would need an auth token plus a reachable
          # collector URL, and GlitchTip publishes to 127.0.0.1 only
          # (MONITORING_BIND), which a GitHub runner cannot reach at all.
          #
          # Leaving it on is what broke this build: with no android/sentry.properties
          # the script does NOT fail loudly — flavorAware is false, so the missing
          # file is only logged (sentry.gradle.kts:643) and sentry-cli then runs
          # with a null token against sentry.io and exits 1.
          #
          # Cost is symbolication only: crashes still arrive, with minified frames.
          # To turn it back on, put the collector behind a public HTTPS proxy,
          # create android/sentry.properties (defaults.url/org/project) or set
          # SENTRY_AUTH_TOKEN, and drop this line.
          SENTRY_DISABLE_AUTO_UPLOAD: "true"
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file="$PWD/app/release.keystore" \
            -Pandroid.injected.signing.store.password="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.ANDROID_KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.ANDROID_KEY_PASSWORD }}"

      - name: Stage APK with a stable name
        run: cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk beyou-latest.apk

      - name: Publish to rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mobile-latest
          name: BeYou Mobile (latest)
          files: beyou-latest.apk
          body: |
            Auto-built from `${{ github.sha }}` on push to main.
            Install: open this page on your Android phone and download `beyou-latest.apk`
            (enable "install unknown apps" for your browser the first time).
