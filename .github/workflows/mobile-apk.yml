name: Mobile APK

# Builds a signed release APK on every push to main and publishes it to a
# rolling GitHub Release ("mobile-latest") with a STABLE filename, so the
# download URL never changes:
#   https://github.com/AndDev741/Beyou-Frontend/releases/download/mobile-latest/beyou-latest.apk
#
# One-time setup (repo Settings → Secrets and variables → Actions):
#   EXPO_PUBLIC_API_URL = https://<your-public-backend>/api/v1  (must be HTTPS)
#     — may be a repo Variable or a Secret; the build reads either.
#   EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID = <web-oauth-client-id>.apps.googleusercontent.com
#     — the Web OAuth client id; without it signIn() returns a null idToken and
#       "Continue with Google" silently fails. Variable OR Secret; build reads either.
#   EXPO_PUBLIC_SENTRY_DSN = <DSN of the beyou-mobile GlitchTip project>
#     — optional. Omit it and the APK simply ships with error reporting off
#       (telemetry.ts no-ops without a DSN). Must point at a PUBLICLY reachable
#       collector: the app runs on real phones outside your network, so a
#       localhost or LAN address reports nowhere. Variable OR Secret.
#   Secrets:  ANDROID_KEYSTORE_BASE64   (base64 of a keystore you generate once)
#             ANDROID_KEYSTORE_PASSWORD
#             ANDROID_KEY_ALIAS
#             ANDROID_KEY_PASSWORD
# Generate the keystore + base64 (run locally, keep the .keystore file safe):
#   keytool -genkeypair -v -keystore beyou.keystore -alias beyou \
#     -keyalg RSA -keysize 2048 -validity 10000 \
#     -storepass <pw> -keypass <pw> -dname "CN=Beyou"
#   base64 -w0 beyou.keystore   # paste output into ANDROID_KEYSTORE_BASE64

on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "packages/**"
      - ".github/workflows/mobile-apk.yml"
  workflow_dispatch:

# Scoped per ref so consecutive pushes to main still supersede each other (only
# the newest APK matters), while a workflow_dispatch from a branch runs to the
# end instead of being cancelled by whatever lands on main meanwhile.
concurrency:
  group: mobile-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # publish the release
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      # Restores ~/.gradle between runs. A cold runner re-downloads every Maven
      # dependency and recompiles every module: the last uncached build reported
      # "870 actionable tasks: 870 executed", nothing from cache. Saves the cache
      # only on main (the action is read-only on other branches), which is where
      # this workflow normally runs anyway.
      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Prebuild Android project
        working-directory: apps/mobile
        env:
          EXPO_NO_TELEMETRY: "1"
        run: npx expo prebuild --platform android --no-install

      - name: Decode release keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > apps/mobile/android/app/release.keystore

      - name: Build release APK
        working-directory: apps/mobile/android
        env:
          # EXPO_PUBLIC_* is inlined into the JS bundle at build time — this is
          # what points the installed app at your public backend. Accept it as a
          # repo Variable OR a Secret (falls back to the secret if the var is unset).
          EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL || secrets.EXPO_PUBLIC_API_URL }}
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ vars.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID || secrets.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
          # Inlined into the bundle by Metro during this task, same as the two
          # above. Without it the APK ships with error reporting off.
          EXPO_PUBLIC_SENTRY_DSN: ${{ vars.EXPO_PUBLIC_SENTRY_DSN || secrets.EXPO_PUBLIC_SENTRY_DSN }}
          # Product analytics — same inlining contract. Without the key the APK
          # ships with analytics off; the Beyou PostHog project is EU-hosted, so
          # the host must be set alongside the key.
          EXPO_PUBLIC_POSTHOG_KEY: ${{ vars.PROD_POSTHOG_KEY || secrets.PROD_POSTHOG_KEY }}
          EXPO_PUBLIC_POSTHOG_HOST: ${{ vars.PROD_POSTHOG_HOST || secrets.PROD_POSTHOG_HOST }}
          # Skips the source-map upload task that the @sentry/react-native/expo
          # config plugin adds to release builds (sentry.gradle.kts:50).
          #
          # It is not a workaround for a misconfiguration — the upload has
          # nowhere to go. sentry-cli would need an auth token plus a reachable
          # collector URL, and GlitchTip publishes to 127.0.0.1 only
          # (MONITORING_BIND), which a GitHub runner cannot reach at all.
          #
          # Leaving it on is what broke this build: with no android/sentry.properties
          # the script does NOT fail loudly — flavorAware is false, so the missing
          # file is only logged (sentry.gradle.kts:643) and sentry-cli then runs
          # with a null token against sentry.io and exits 1.
          #
          # Cost is symbolication only: crashes still arrive, with minified frames.
          # To turn it back on, put the collector behind a public HTTPS proxy,
          # create android/sentry.properties (defaults.url/org/project) or set
          # SENTRY_AUTH_TOKEN, and drop this line.
          SENTRY_DISABLE_AUTO_UPLOAD: "true"
        # Flags, measured against the 28m59s build of 02fbf1d:
        #
        # reactNativeArchitectures — the prebuild default is all four ABIs, so
        #   every .so compiles four times. x86/x86_64 exist for emulators only
        #   and this APK ships to real phones; armeabi-v7a is 32-bit ARM, gone
        #   from Android hardware for years. Those three cost ~12 min of the
        #   ~14 min spent in CMake, and they inflate the download users get.
        # -x lintVital* — AGP wires lint into assembleRelease and it ran across
        #   20 modules for ~3.7 min, most of it linting third-party code we do
        #   not own. ci.yml already typechecks and tests what we do own.
        # --build-cache + setup-gradle — reuse of Kotlin/Java compilation and
        #   resolved dependencies. CMake tasks are not cacheable by Gradle, so
        #   this only touches the JVM half.
        # jvmargs — the generated gradle.properties asks for 2 GB; the runner
        #   has 16 GB and the default made Kotlin, dex and lint fight the GC.
        # kotlin in-process — compiles inside the Gradle daemon instead of
        #   starting a second JVM that lives for one build.
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease \
            --build-cache \
            --init-script ../tools/ci-build.init.gradle \
            -PreactNativeArchitectures=arm64-v8a \
            -Pkotlin.compiler.execution.strategy=in-process \
            -Dorg.gradle.jvmargs="-Xmx6g -XX:MaxMetaspaceSize=1g" \
            -x lintVitalAnalyzeRelease -x lintVitalRelease -x lintVitalReportRelease \
            -Pandroid.injected.signing.store.file="$PWD/app/release.keystore" \
            -Pandroid.injected.signing.store.password="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -Pandroid.injected.signing.key.alias="${{ secrets.ANDROID_KEY_ALIAS }}" \
            -Pandroid.injected.signing.key.password="${{ secrets.ANDROID_KEY_PASSWORD }}"

      - name: Stage APK with a stable name
        run: cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk beyou-latest.apk

      # A workflow_dispatch run from a feature branch reaches this step too, and
      # the rolling release is what real users download. Keep branch builds out
      # of it: they land as a job artifact instead.
      - name: Upload APK as a job artifact
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: beyou-apk-${{ github.sha }}
          path: beyou-latest.apk

      - name: Publish to rolling release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: mobile-latest
          name: Beyou Mobile (latest)
          files: beyou-latest.apk
          body: |
            Auto-built from `${{ github.sha }}` on push to main.
            Install: open this page on your Android phone and download `beyou-latest.apk`
            (enable "install unknown apps" for your browser the first time).
