server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers. The backend sets its own on API responses; these are for
    # the documents nginx serves, which is where clickjacking and sniffing apply
    # and where nothing was set at all before.
    #
    # always: without it nginx drops these on error responses, so the 404 page
    # and any upstream failure would ship bare.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # HSTS. TLS terminates at Cloudflare, so this is about the browser refusing
    # to try http:// again rather than about this listener, which only ever sees
    # plaintext from the tunnel. No preload: that is a one-way door and belongs
    # to whoever owns the domain, not to a container's config file.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # CSP in REPORT-ONLY, deliberately, and it is not finished until someone
    # promotes it.
    #
    # The policy below mirrors the backend's, which is proven — but the backend's
    # governs API responses, and an API response is not a document, so it has
    # never actually constrained a single fetch the app makes. This one would.
    # The unknown is connect-src: the error collector's host is baked in at build
    # time from VITE_SENTRY_DSN, and a CSP that forgets it does not fail loudly,
    # it just silently stops reporting errors — which is the one thing you would
    # not notice was broken.
    #
    # So: collect violations first, add whatever real hosts show up, then change
    # this one header name to Content-Security-Policy. Report-Only blocks nothing
    # in the meantime, which is the point.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; connect-src 'self' https://accounts.google.com https://www.googleapis.com; font-src 'self' https: data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # AI agent SSE stream: must NOT be buffered, or tokens arrive in one blob
    # at the end instead of streaming. Regex location wins over the /api/v1/
    # prefix below. (Backend also sends X-Accel-Buffering: no as a fallback.)
    location ~ ^/api/v1/ai/agent/chats/.+/stream$ {
        proxy_pass http://backend:8099;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # Proxy API requests to backend (profile photos, etc.)
    location /api/v1/ {
        proxy_pass http://backend:8099;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Source maps are built as "hidden" (emitted, but never referenced from the
    # served bundles) so they can be uploaded to the error collector without
    # being reachable here. Uploading also deletes them from dist/, but if an
    # upload-less build ever ships them into the image, a guessed URL must still
    # get nothing — serving a map publishes the entire application source.
    # This must precede the static-asset rule below, which would otherwise match
    # the `.js` in `.js.map`.
    location ~* \.map$ {
        return 404;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        # add_header in a location REPLACES the inherited set rather than adding
        # to it, so the server-level headers above have to be repeated here or
        # every static asset ships without them.
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
}
